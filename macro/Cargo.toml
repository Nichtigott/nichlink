[package]
name = "nichlink-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/Nichtigott/nichlink"
homepage = "https://github.com/Nichtigott/nichlink"
description = "Face field normalisation and diagnostics for NichLink's authoring macros"
keywords = ["registration", "proc-macro", "codegen", "macros"]
categories = ["development-tools::procedural-macro-helpers", "development-tools"]
readme = "README.md"
documentation = "https://docs.rs/nichlink-macro"

[lib]
name = "nichlink_macro"
proc-macro = true

[dependencies]
nichlink-core = { path = "../core", version = "0.1.0", features = ["syntax"] }
proc-macro2 = "1"

[dev-dependencies]
# The mirror has to parse as the Rust an editor compiles it as.
# 镜像必须能按编辑器编译它的那种 Rust 解析。
syn = { version = "2", features = ["full", "parsing"] }
