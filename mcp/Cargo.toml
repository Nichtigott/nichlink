[package]
name = "nichlink-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/Nichtigott/nichlink"
homepage = "https://github.com/Nichtigott/nichlink"
description = "MCP stdio bridge for NichLink: source, registry, and validated authoring queries"
keywords = ["mcp", "json-rpc", "ai", "stdio"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
documentation = "https://docs.rs/nichlink-mcp"

[lib]
name = "nichlink_mcp"
path = "src/lib.rs"

[dependencies]
# The registry tool reports the tree the *build* sees, so its rows come from the
# one implementation that derives them — `face_views` — rather than from a second
# scanner inside the bridge. That is the whole point of the tool: an agent asks
# the registry instead of re-deriving it by grepping.
# 注册树工具报告的是**构建**所见的那棵树，因此它的行来自唯一推导它们的那份实现
# ——`face_views`——而不是桥内部的第二个扫描器。这正是该工具的意义：代理去问注册树，
# 而不是靠 grep 重新推导。
nichlink-build-method = { path = "../build_method", version = "0.1.3" }
# The write path calls the *same* authoring executor Studio does, so an agent's
# edit goes through the kernel admission and topology checks instead of
# re-implementing them here. `authoring` is the feature that carries it.
# 写入路径调用与 Studio 相同的 authoring 执行器,因此代理的编辑走内核的准入与拓扑校验,而不是在
# 这里重新实现一遍。`authoring` 就是承载它的特性。
nichlink-run-method = { path = "../run_method", version = "0.1.3", features = ["authoring"] }
nichlink-core = { path = "../core", version = "0.1.3" }
serde_json = "1"

[[bin]]
name = "nichlink-mcp"
path = "src/main.rs"
doc = false
