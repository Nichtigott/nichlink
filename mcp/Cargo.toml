[package]
name = "nichlink-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/Nichtigott/nichlink"
homepage = "https://github.com/Nichtigott/nichlink"
description = "MCP stdio bridge for the five compact NichLink Rust source queries"
keywords = ["mcp", "json-rpc", "ai", "stdio"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
documentation = "https://docs.rs/nichlink-mcp"

[lib]
name = "nichlink_mcp"
path = "src/lib.rs"

[dependencies]
nichlink-core = { path = "../core", version = "0.1.0" }
serde_json = "1"

[[bin]]
name = "nichlink-mcp"
path = "src/main.rs"
doc = false
