[package]
name = "nichlink-run-method"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/Nichtigott/nichlink"
homepage = "https://github.com/Nichtigott/nichlink"
description = "Compatibility shell: the host-facing crate name this surface had before the nine-to-three merge"
keywords = ["runtime", "tracing", "registration", "macros"]
categories = ["development-tools", "rust-patterns"]
readme = "README.md"

[dependencies]
nichlink-toolchain = { path = "../toolchain", version = "0.2.1" }

[features]
# The old crate's only feature, forwarded so an existing manifest keeps working unchanged.
# 旧 crate 唯一的特性，转发过来，好让既有清单原样可用。
authoring = ["nichlink-toolchain/authoring"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)"] }
