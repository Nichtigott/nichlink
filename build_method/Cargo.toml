[package]
name = "nichlink-build-method"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/Nichtigott/nichlink"
homepage = "https://github.com/Nichtigott/nichlink"
description = "Source discovery, manifest parsing, cache, scope, and StaticPlan generation"
keywords = ["build-script", "codegen", "registration", "discovery"]
categories = ["development-tools::build-utils", "development-tools"]
readme = "README.md"
documentation = "https://docs.rs/nichlink-build-method"

[dependencies]
nichlink-core = { path = "../core", version = "0.1.3", features = ["syntax"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# `package_name` parses `cargo metadata` output. It is the only JSON this crate
# reads, and the function is called by standalone surfaces only — the build
# pipeline takes its namespace from `CARGO_PKG_NAME` — so the dependency buys one
# authority for the name instead of a copy per surface.
# `package_name` 解析 `cargo metadata` 的输出。这是本 crate 读取的唯一一份 JSON，而该函数
# 只被独立执行面调用——构建管线从 `CARGO_PKG_NAME` 取命名空间——因此这个依赖换来的是包名的
# 唯一权威，而不是每个执行面一份副本。
serde_json = "1"
syn = { version = "2", features = ["full", "parsing", "visit"] }

[lib]
name = "nichlink_build_method"
path = "src/lib.rs"
