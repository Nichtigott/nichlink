[package]
name = "nichlink-build-method"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/Nichtigott/nichlink"
homepage = "https://github.com/Nichtigott/nichlink"
description = "Source discovery, manifest parsing, cache, scope, and StaticPlan generation"
keywords = ["build-script", "codegen", "registration", "discovery"]
categories = ["development-tools::build-utils", "development-tools"]
readme = "README.md"
documentation = "https://docs.rs/nichlink-build-method"

[dependencies]
nichlink-core = { path = "../core", version = "0.1.0", features = ["syntax"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "parsing", "visit"] }

[lib]
name = "nichlink_build_method"
path = "src/lib.rs"
