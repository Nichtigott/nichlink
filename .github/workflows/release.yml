name: nichlink-release

# A published crates.io version is immutable — it can be yanked, never replaced —
# and this workspace is a hard publish chain, so a release is a tag and nothing
# else starts it: `v0.1.0` publishes `0.1.0`, or the job stops before uploading.
# 已发布的 crates.io 版本不可变（只能 yank，不能替换），而本工作区是一条硬发布链，因此
# 一次发布就是一个 tag，且只有 tag 会启动它：`v0.1.0` 发布 `0.1.0`，否则任务在上传前停下。
on:
  push:
    tags: ["v*"]
  # A manual run is the rehearsal path: every check, and no upload. Publishing is
  # reachable only from a tag ref, because `cargo publish` is irreversible and
  # only the tag ties an upload to a version. A `publish` input used to live here
  # and let a branch run upload whatever version the manifests carried, with the
  # tag check skipped — so the sentence above ("a release is a tag and nothing
  # else starts it") was false whenever someone ticked it. Recovering a partial
  # publication does not need it: re-run the failed jobs of the tag's own run,
  # which keeps `GITHUB_REF` pointing at the tag.
  # 手动运行是演练路径：跑全部检查，不上传。发布只能从 tag ref 到达，因为 `cargo publish`
  # 不可撤销，而只有 tag 把一次上传绑定到某个版本。这里曾有一个 `publish` 输入，能让一次分支
  # 运行上传清单里写着的任何版本、且跳过 tag 检查——于是只要有人勾上它，上面那句"一次发布就是
  # 一个 tag，且只有 tag 会启动它"就是假的。恢复一次部分发布不需要它：重跑 tag 那次运行的失败
  # 任务即可，重跑保留 `GITHUB_REF` 指向 tag。
  workflow_dispatch:

permissions:
  contents: read

# Two runs of the same tag would race for the same immutable versions, and the
# index wait can hang; both are bounded here rather than left to luck.
# 同一个 tag 的两次运行会争抢同一批不可变版本，而等待 index 有可能挂住；两者都在这里被限住，
# 而不是交给运气。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # This job holds `CARGO_REGISTRY_TOKEN` (the step env at the publish step below), so its
      # actions are pinned by commit rather than by a moving tag: a retagged upstream action would
      # otherwise run before the publish step and could rewrite what that step executes. The comment
      # names the tag or branch each SHA came from, because a bare SHA tells the next reader nothing
      # about whether it is current. `ci.yml`'s actions stay tag-pinned on purpose: that workflow
      # carries no registry secret, so pinning there is tidiness rather than safety (audit `RC7`,
      # option A chosen by the maintainer 2026-09-28).
      # 本 job 持有 `CARGO_REGISTRY_TOKEN`（见下方发布步骤的步骤级 env），因此它的 action 按提交
      # pin，而不是按会移动的 tag：否则一个被重新打 tag 的上游 action 会先于发布步骤运行，并可能
      # 改写那一步真正执行的东西。注释写明每个 SHA 来自哪个 tag 或分支——光有 SHA，下一个读者无从
      # 判断它是否还新。`ci.yml` 的 action 有意保持 tag 形式：那个工作流不携带 registry 秘密，在
      # 那里 pin 属于整洁而非安全（审计 `RC7`，维护者 2026-09-28 选定选项 A）。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-28
        with:
          components: rustfmt, clippy

      - name: Tag names this version
        # The release workflow's one hard precondition. `cargo publish` would
        # happily upload whatever version the manifests carry; only this step
        # ties the upload to the tag that is supposed to describe it, and a
        # mismatch cannot be undone afterwards.
        # 本工作流唯一硬性前提。`cargo publish` 会照发清单里的版本号；只有这一步把上传绑定
        # 到本应描述它的 tag 上，而一旦不匹配就再也无法挽回。
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The release version lives in `[workspace.package]` and nowhere else, and the
          # reader is the release's own: this step asks `tools/nichlink-publish`, which is
          # what the publish path uses. Reading the first `version = "…"` line here used to
          # be enough for a tag to pass while `cargo publish` uploaded a different version
          # — members inherit `[workspace.package]`, so a stale centralized requirement
          # above that section named the tag check's version instead of the release's — and
          # a second copy of the reader drifted from the first on the spellings where they
          # disagree (audit RC4).
          # 发布版本只存在于 `[workspace.package]`，而读取器就是发布自己用的那个：这一步问
          # `tools/nichlink-publish`，也就是发布路径所用的那个。过去在这里读根清单第一行
          # `version = "…"` 曾足以让 tag 通过、而 `cargo publish` 上传另一个版本——成员继承
          # `[workspace.package]`，因此该节之上的一行陈旧集中依赖要求会冒充 tag 检查所用的版本——
          # 而读取器的第二份副本又会在两者分歧的拼写上与第一份漂移（审计 RC4）。
          version=$(tools/nichlink-publish --workspace-version)
          if [ -z "$version" ]; then
            echo "Cargo.toml names no version in [workspace.package]" >&2
            exit 1
          fi
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name workspace version $version" >&2
            exit 1
          fi

      - name: Release tables match the manifests
        run: tools/nichlink-publish --check-table

      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests (all features, all targets)
        run: cargo test --workspace --all-features --all-targets
      - name: Doctests (all features)
        run: cargo test --workspace --all-features --doc
      - name: Clippy (all features, all targets)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Package audit
        run: tools/nichlink-package-audit
      - name: Release artifact audit
        run: tools/nichlink-release-audit

      - name: Publish in dependency order
        # `--publish --yes` is the only invocation that uploads: every other mode
        # of `tools/nichlink-publish` is a dry run, so a mistaken tag is caught by
        # the gates above rather than by an upload nobody can take back.
        # The condition repeats the tag requirement instead of relying on the
        # trigger list: an upload must be unable to happen on a ref that the check
        # above did not guard, whatever events are added here later.
        # `--publish --yes` 是唯一会真正上传的调用：`tools/nichlink-publish` 的其他模式都是
        # dry run，因此打错的 tag 会被上面的门禁挡住，而不是被一次收不回的上传发现。
        # 这个条件重复写出 tag 要求，而不是依赖触发列表：无论以后在这里加什么事件，上传都不能
        # 发生在上面的检查没有守住的那个 ref 上。
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: tools/nichlink-publish --publish --yes

      - name: A stranger can consume the release
        # Packaging reads local paths; only a consumer reads the published
        # requirements. This builds a throwaway crate outside the checkout and
        # `cargo add`s all nine by version, which is the half of the rehearsal
        # that cannot run before the upload — and it is worth nothing unless the
        # upload happened, so it carries the same condition.
        # 打包读的是本地路径，只有消费者读的是已发布的要求。这一步在本检出之外建一个一次性
        # crate，按版本 `cargo add` 九个 crate——这是演练中无法在上传之前跑的那一半；而上传没
        # 发生的话它毫无意义，因此它带着同一个条件。
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: tools/nichlink-publish --verify-consumers
