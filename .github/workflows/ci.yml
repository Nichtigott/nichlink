name: nichlink-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.96.0", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Release tests
        run: cargo test --workspace --release --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: External-path rehearsal
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        # Copies the example hosts outside the checkout, repoints their path
        # dependencies here, detaches them from the workspace and builds them from
        # scratch. A layout that only works in-tree fails this, which is the class
        # of defect the external-path rehearsal exists for. It runs on one cell
        # because it rebuilds the workspace crates in a fresh target directory.
        # 把示例宿主复制到检出之外，把它们的路径依赖指向这里，让它们脱离工作区并从零构建。
        # 只在树内成立的布局会在这里失败，而这正是外部路径演练要抓的那类缺陷。它只在一个矩阵
        # 单元上跑，因为它要在全新的 target 目录里重建工作区各 crate。
        env:
          NICHLINK_REHEARSAL_CARGO_FLAGS: ""
        run: tools/nichlink-external-rehearsal
      - name: Partition rehearsal (both shapes)
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        # Partitions a host in both shapes it can be built in — a member of a workspace, and a host with
        # no workspace above it — builds each one, and checks the four facts the maintainer fixed: the
        # host's own sources byte-identical, the same graft plan in every shape, the same face
        # identities, and a `promote` that still lands on a partitioned tree. Every defect this feature
        # ever had was found by doing the whole thing once, by hand; this step is that run, as a gate.
        # It runs on one cell because it builds three throwaway projects from scratch.
        # 把宿主在它能被构建的**两个形状**里各分区一次——某个工作区的成员，以及上面没有任何工作区的宿主
        # ——各构建一次，并检查维护者定下的四条事实：宿主自己的源码逐字节相同 · 每个形状里同一份 graft
        # 计划 · 同样的注册面身份 · 以及 `promote` 在分区树上仍能落地。这个特性有过的每一个缺陷都是靠手工
        # 把整件事完整做一遍才发现的；本步骤就是那次运行，作为一道门禁。它只在一个矩阵单元上跑，因为它要
        # 从零构建三个一次性项目。
        env:
          NICHLINK_REHEARSAL_CARGO_FLAGS: ""
        run: tools/nichlink-partition-rehearsal
      - name: Graft matrix (root face, overlap, re-partition)
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        # Five shapes only a real host plus a real cargo can answer: a cut on the root face with `full`,
        # two overlapping cuts (which must be refused by name), a re-partition whose plan must not change,
        # the replacement's own subtree (which must not enter the host's generated tree), and the three
        # middle-node shapes (which must publish the same faces). Each was hand-measured before it was
        # written down here.
        # 五种只有"真宿主 + 真 cargo"能回答的形状：根面 + `full` 的切口、两条重叠切口（必须点名拒绝）、
        # 一次"计划不得改变"的重新划分、替换方自己的子树（不得进入宿主的生成树）、以及三种中间节点形状
        # （必须发布同一批面）。每一种都是先手工量过才写进这里的。
        env:
          NICHLINK_GRAFT_MATRIX_CARGO_FLAGS: ""
        run: tools/nichlink-graft-matrix
      - name: Daily behaviours (a registry face's rule file)
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        # Every row applies one everyday edit to a real host (on its own copy), then runs the real
        # `check` and the real `cargo build`, and asserts both the expectation and the one invariant
        # that matters: a build failure must be one `check` already refused. That invariant is the
        # regression guard for the measured defect this step exists for — deleting a registry-owning
        # face's `registry_rule.rs` made `check` say `ok` while `cargo build` died with
        # `error[E0433]: cannot find registry_rule in super`.
        # 每一行都在**真宿主**上施加一种日常改动（各自的副本），再跑真的 `check` 与真的 `cargo build`，
        # 既断言期望，也断言唯一要紧的那条不变量：**build 失败必须是 check 已经拒绝过的**。该不变量正是
        # 本步骤为之存在的那个实测缺陷的回归闸门——删掉拥有注册机的面旁边的 `registry_rule.rs` 时，
        # `check` 曾报 `ok`，而 `cargo build` 死于 `error[E0433]: cannot find registry_rule in super`。
        env:
          NICHLINK_BEHAVIORS_CARGO_FLAGS: ""
        run: tools/nichlink-daily-behaviors
      - name: Real-project size (29 faces, two crates, cuts handed away)
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        # The maintainer's question in the shape of a test: in a host with real size, do graft and crate
        # partition conflict? Three configurations, all measured with a real cargo: cuts on faces the
        # host keeps (host 2, facade 2), the whole container handed away (host 0, ghost 2, facade 2),
        # and the unpartitioned baseline. It also prints wall times, because the split's cost is part
        # of the question.
        # 维护者的问题长成一道测试：真实规模的宿主里，graft 与 crate 划分会不会冲突？三种配置都用真 cargo
        # 量过：切口留在宿主保留的面上（宿主 2、facade 2）、整棵容器交出去（宿主 0、幽灵 2、facade 2）、
        # 以及未拆分的基线。它同时打印墙上时间，因为拆分的代价也是问题的一部分。
        env:
          NICHLINK_REAL_PROJECT_CARGO_FLAGS: ""
        run: tools/nichlink-real-project-test
      - name: MCP session (mounted over stdio)
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        # A real client session: initialize, tools/list, then tools/call for every advertised tool. The
        # one-shot `--call` mode tests the tools; this tests the protocol surface a client attaches to.
        # 真的客户端会话：initialize、tools/list，然后对每个被广告的工具发 tools/call。一次性 `--call`
        # 模式测工具本身；这里测客户端真正接上的协议面。
        env:
          NICHLINK_MCP_SESSION_CARGO_FLAGS: ""
        run: tools/nichlink-mcp-session
      - name: Package standalone crates
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        # Early leftover kept as a core-only smoke check. Packaging
        # nichlink-toolchain on its own here would need its versioned
        # dependency on nichlink-kernel to resolve on the index, and an unpublished
        # workspace version does not; the package-audit step below covers every
        # crate and skips that same set.
        run: cargo package -p nichlink-kernel --locked --allow-dirty
      - name: Package audit (nine crates, skipping unpublished dependencies)
        if: runner.os == 'Linux' && matrix.toolchain == 'stable'
        # Runs tools/nichlink-package-audit beside the core-only package step.
        # The script verifies every crate whose versioned NichLink dependencies
        # are already resolvable on crates.io, warns about and skips the ones
        # whose dependency has not been published yet, and exits 0 in both
        # cases. A packaging regression in a crate that could be checked still
        # fails the step: unlike the earlier continue-on-error version, silence
        # no longer hides a failure.
        # 与仅打包 core 的步骤并列运行 tools/nichlink-package-audit。脚本校验所有
        # 版本依赖已能在 crates.io 上解析的 crate；对依赖尚未发布的包给出警告并跳过，
        # 两种情况都以 0 退出。真正可检查的 crate 若打包回归仍会让本步骤失败：与早先
        # 带 continue-on-error 的版本不同，这里不再用容忍掩盖失败。
        run: tools/nichlink-package-audit

  features:
    # The verify matrix only ever builds each crate's default features, so
    # studio's `prototype-fixtures` tests are not compiled anywhere today
    # (plugin-host's `process-tools` has its own job below). This job covers
    # the all-features set and the feature-less surface on one runner instead
    # of duplicating it across six matrix cells.
    # verify 矩阵只构建各 crate 的默认特性，因此 studio 的 `prototype-fixtures`
    # 测试目前在任何地方都不会被编译（plugin-host 的 `process-tools` 另有任务）。
    # 本任务在一个 runner 上覆盖全特性集与无特性表面，而不是在六个矩阵单元里重复。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests (all features)
        run: cargo test --workspace --all-features --all-targets
      - name: Doctests (all features)
        # `--all-targets` suppresses doctests entirely, so a `compile_fail` pin
        # gated behind a non-default feature is compiled by no other command:
        # `run_method`'s `authoring` gate holds the `edit_module` deletion pin at
        # `authoring/operations/operations.rs:335`. Without this step that pin is
        # a comment, and the release-audit job's `cargo test --workspace` cannot
        # see it either because it runs default features.
        # `--all-targets` 会完全跳过 doctest，因此门控在非默认特性之后的 `compile_fail`
        # 钉子没有任何其他命令会编译它：`run_method` 的 `authoring` 门控持有
        # `edit_module` 的删除钉子，位于 `authoring/operations/operations.rs:335`。
        # 没有这一步，那个钉子只是一段注释；release-audit 任务的
        # `cargo test --workspace` 也看不到它，因为那条命令跑的是默认特性。
        run: cargo test --workspace --all-features --doc
      - name: Check (no default features)
        run: cargo check --workspace --no-default-features --all-targets
      - name: Clippy (all features)
        # The verify matrix lints each crate's default features only, so a warning
        # that exists solely behind `prototype-fixtures`, `authoring`,
        # `process-tools`, `syntax` or `dev-supervisor` reached no gate at all.
        # verify 矩阵只对每个 crate 的默认特性跑 lint，因此只存在于
        # `prototype-fixtures`、`authoring`、`process-tools`、`syntax` 或 `dev-supervisor`
        # 之后的警告此前没有任何门禁会看到。
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Visual check (tmux)
        # The TUI is the surface a reader actually sees, and no other step renders
        # it: a test backend checks a buffer, not a terminal. Each scene drives the
        # real binary in a fixed-size pane and its capture must be non-empty.
        # TUI 是读者真正看到的那一面，而其他步骤都不渲染它：测试后端检查的是缓冲区而不是
        # 终端。每个场景在固定尺寸的面板里驱动真实二进制，抓到的内容必须非空。
        env:
          NICHLINK_VISUAL_CARGO_FLAGS: ""
        run: |
          command -v tmux >/dev/null || (sudo apt-get update && sudo apt-get install -y tmux)
          tools/nichlink-visual home graph tree-demo partition
          for scene in home graph tree-demo partition; do
            test -s "target/visual/$scene.txt"
          done
      - name: Release tables match the manifests
        # No network: `--check-table` compares the dependency and level tables in
        # `tools/nichlink-publish` against the manifests that decide the real
        # publish order. It runs here as well as in the release workflow because
        # the tables are hand-maintained and rot between releases — `nichlink-toolchain`
        # grew a direct `nichlink-kernel` requirement while the table still listed
        # only the other three, and every gate stayed green.
        # 不需要网络：`--check-table` 把 `tools/nichlink-publish` 里的依赖表与层表同决定真实
        # 发布顺序的清单对比。它既在这里跑也在发布工作流里跑，因为这两张表是手工维护的、会在
        # 两次发布之间腐烂——`nichlink-toolchain` 增加了对 `nichlink-kernel` 的直接依赖，而表里仍只列
        # 另外三个，所有门禁却都是绿的。
        run: tools/nichlink-publish --check-table
      - name: Publish dry run
        # `tools/nichlink-publish` without `--publish` packages every crate whose
        # versioned dependencies are on the index, waits for the rest, and uploads
        # nothing. It needs a network, which is why it lives in this job and not in
        # the offline local battery.
        # 不带 `--publish` 的 `tools/nichlink-publish` 会打包所有版本依赖已在 index 上的
        # crate、把其余的报成等待，且不上传任何东西。它需要网络，这正是它在这个任务而不是
        # 离线本地门禁里的原因。
        run: tools/nichlink-publish
      - name: Real crates from the registry (not refused by name)
        # Points the read-only surface at source trees nobody wrote for us. Every rule in this repository
        # is a description of *some* Rust, and a rule that is really a description of *this checkout* can
        # only be caught by looking at someone else's crate: the nesting guard counted the tokens of
        # `#[doc = "…"]`, so `tokio/src/fs/mod.rs` — 213 consecutive `//!` lines — was refused with
        # "input nests 1025 levels … above the limit of 1024", and four more of that crate's files with it
        # (audit `M7`, §M7.56). The step above has already fetched every dependency, so the registry cache
        # this reads is populated; it copies each crate before checking it, so nothing in the cache is
        # written to.
        # 把只读面指向没人为我们写的源码树。本仓库里每条规则都是对**某种** Rust 的描述，而一条其实只是
        # 对**本检出**的描述的规则，只能靠看别人的 crate 才抓得到：嵌套守卫在数 `#[doc = "…"]` 的 token，
        # 于是 `tokio/src/fs/mod.rs`——连续 213 行 `//!`——被以「input nests 1025 levels … above the
        # limit of 1024」拒绝，同一个 crate 还有四个文件同样被拒（审计 `M7`，§M7.56）。上一步已经取回
        # 全部依赖，因此它读的 registry 缓存是满的；它在检查前先复制每个 crate，因此缓存不会被写入。
        env:
          NICHLINK_CARGO_FLAGS: ""
          NICHLINK_REAL_PROJECTS: "60"
        run: tools/nichlink-real-projects
      - name: IDE mirror (rust_analyzer cfg)
        # No other step compiles this: the check builds two host examples again
        # under a cfg only an editor uses. A nested face's derived rule path
        # resolves in the real module tree but not in the crate-root shadow
        # rust-analyzer needs, so without this step the editor's view of a host
        # can rot while every other gate stays green.
        # 没有其他步骤会编译它：这项检查用一条只有编辑器才用的 cfg 把两个宿主示例再构建
        # 一遍。嵌套面派生的规则路径在真实模块树里能解析，而 rust-analyzer 需要的 crate 根
        # 影子里解析不了；没有这一步，宿主在编辑器里的视图会腐化，而其余门禁全是绿的。
        run: cargo test -p nichlink-example-control-button --test ide_mirror -- --ignored

  deny:
    # advisories / licenses / bans are configured in deny.toml.
    # advisories / licenses / bans 的策略在 deny.toml。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses

  release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Release scale and symbol audit
        run: tools/nichlink-release-audit
      - name: Scale memory audit
        run: tools/nichlink-scale-audit

  process-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p nichlink-toolchain --features process-tools
