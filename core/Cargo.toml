[package]
name = "nichlink-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Registry, transaction, contracts, grafts, and diagnostics for NichLink"
readme = "README.md"
documentation = "https://docs.rs/nichlink-core"
autobins = false

[features]
syntax = ["dep:proc-macro2", "dep:quote", "dep:syn"]

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
quote = { version = "1", optional = true }
syn = { version = "2", features = ["full", "parsing", "visit"], optional = true }

[lib]
name = "nichlink"
path = "src/lib.rs"
