[package]
name = "nichlink-run-method"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/Nichtigott/nichlink"
homepage = "https://github.com/Nichtigott/nichlink"
description = "Runtime registry trees, transactions, tracing, plugins, and authoring for NichLink"
keywords = ["runtime", "tracing", "registration", "macros"]
categories = ["development-tools", "rust-patterns"]
readme = "README.md"
documentation = "https://docs.rs/nichlink-run-method"

[features]
authoring = ["nichlink-core/syntax", "dep:syn"]

[dependencies]
nichlink-core = { path = "../core", version = "0.1.3" }
nichlink-macro = { path = "../macro", version = "0.1.3" }
syn = { version = "2", features = ["full", "parsing", "visit"], optional = true }

[lib]
name = "nichlink_run_method"
path = "src/lib.rs"

# The IDE-only field splice carries `cfg(rust_analyzer)`, which belongs to the
# crate being edited. A normal host declares it from its build script; this
# crate has none, so it declares the name here.
# 仅供 IDE 的字段拼接带 `cfg(rust_analyzer)`，它属于被编辑的那个 crate。普通宿主由
# build script 声明；本 crate 没有 build script，因此在这里声明该名字。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_analyzer)'] }

# `authoring` gates the authoring executor, which is public API; docs.rs must
# build it.
# `authoring` 门控 authoring 执行器，它是公开 API；docs.rs 必须构建它。
[package.metadata.docs.rs]
all-features = true
