<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nichlink 结构对照图（2026-09-28 审计）</title>
<style>
:root{--bg:#0f1419;--fg:#e6e6e6;--muted:#9aa4ae;--card:#161c23;--line:#26313c;--accent:#4da3ff;
--keep:#1f6f43;--change:#8a5a00;--new:#1d4f7c;--danger:#7c2d2d;--ok:#2f7d4f}
@media (prefers-color-scheme: light){:root{--bg:#f7f8fa;--fg:#1b1f24;--muted:#5b6672;--card:#ffffff;
--line:#dde3ea;--accent:#0b63c5;--keep:#d8f2e0;--change:#fdf0d5;--new:#dceafc;--danger:#fadcdc;--ok:#d8f2e0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
header{padding:20px 22px 10px;border-bottom:1px solid var(--line)}
h1{margin:0 0 6px;font-size:20px}
h2{font-size:16px;margin:22px 0 8px}
.sub{color:var(--muted);font-size:12.5px}
.wrap{padding:16px 22px 60px;max-width:1500px;margin:0 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
.tab{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:13px}
.tab[aria-selected="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.panel{display:none}.panel.on{display:block}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto}
.card h3{margin:0 0 8px;font-size:14px}
.card.before h3::before{content:"现状 · ";color:var(--muted)}
.card.after h3::before{content:"建议 · ";color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
tr.moving td:first-child{border-left:3px solid var(--accent)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;border:1px solid var(--line);font-size:12px;margin-right:4px}
.pill.keep{background:var(--keep)}.pill.change{background:var(--change)}.pill.new{background:var(--new)}
.pill.gone{background:var(--danger)}.pill.ok{background:var(--ok)}
code{background:rgba(127,127,127,.14);padding:1px 4px;border-radius:4px;font-size:12.5px}
.controls{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;min-width:240px}
label.chk{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center}
.note{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.badge{font-size:11.5px;color:var(--muted)}
footer{color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:24px;padding-top:10px}
td.act{white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="meta"></div>
</header>
<div class="wrap">
  <div class="controls">
    <input type="search" id="q" placeholder="过滤：crate / 路径 / R-xx / 关键词…">
    <label class="chk"><input type="checkbox" id="onlymoving"> 只看会动的项</label>
    <span class="badge" id="count"></span>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>

  <section class="panel" id="p-crates">
    <div class="cols">
      <div class="card before"><h3>十二个成员现在的体量（audit-inventory.json）</h3><div id="crates-now"></div></div>
      <div class="card after"><h3>方案后的变化（audit-boundary-refactor-plan.md §2.1）</h3><div id="crates-after"></div></div>
    </div>
    <p class="note" id="crates-note"></p>
  </section>

  <section class="panel" id="p-pkg">
    <div class="cols">
      <div class="card before"><h3>包管理</h3><div id="pkg-now"></div></div>
      <div class="card after"><h3>包管理</h3><div id="pkg-after"></div></div>
    </div>
  </section>

  <section class="panel" id="p-tree">
    <div class="cols">
      <div class="card before"><h3>目录与文件归属</h3><div id="tree-now"></div></div>
      <div class="card after"><h3>搬移 / 合并 / 拆分 / 新增</h3><div id="tree-after"></div></div>
    </div>
    <p class="note" id="identity-note"></p>
  </section>

  <section class="panel" id="p-batch">
    <div class="card"><h3>分批（方案 §4）</h3><div id="batches"></div></div>
    <div class="card" style="margin-top:16px"><h3>28 项机械步骤（方案 §3）</h3><div id="actions"></div></div>
  </section>

  <section class="panel" id="p-nam">
    <div class="cols">
      <div class="card before"><h3>命名条目的现状（audit-findings.json 的 NAM-*）</h3><div id="nam-facts"></div></div>
      <div class="card after"><h3>改名 / 改法建议（旧名 → 建议新名）</h3><div id="nam-table"></div></div>
    </div>
    <p class="note" id="nam-note"></p>
  </section>

  <section class="panel" id="p-amb">
    <div class="cols">
      <div class="card before"><h3>歧义条目（audit-findings.json 的 AMB-*）</h3><div id="amb-facts"></div></div>
      <div class="card after"><h3>现状名 → 读者会先当成什么 → 建议</h3><div id="amb-table"></div></div>
    </div>
    <p class="note" id="amb-note"></p>
  </section>

  <footer id="foot"></footer>
</div>

: "mcp 测试页", "batch": "批 4：唯一来源收口"}, {"id": "STR-R-17", "plan_id": "R-17", "title": "mcp 三组收口", "batch": "批 4：唯一来源收口"}, {"id": "STR-R-18", "plan_id": "R-18", "title": "cli 输出出口", "batch": "批 4：唯一来源收口"}, {"id": "STR-R-19", "plan_id": "R-19", "title": "plugin-host 测试拆分", "batch": "批 3：执行面与桥"}, {"id": "STR-R-20", "plan_id": "R-20", "title": "唯一来源收口", "batch": "批 4：唯一来源收口"}, {"id": "STR-R-21", "plan_id": "R-21", "title": "唯一来源收口", "batch": "批 4：唯一来源收口"}, {"id": "STR-R-22", "plan_id": "R-22", "title": "唯一来源收口", "batch": "批 4：唯一来源收口"}, {"id": "STR-R-23", "plan_id": "R-23", "title": "唯一来源收口", "batch": "批 4：唯一来源收口"}, {"id": "STR-R-24", "plan_id": "R-24", "title": "唯一来源收口", "batch": "批 4：唯一来源收口"}, {"id": "STR-R-25", "plan_id": "R-25", "title": "（已否决）`core` 的 tree/ 归并——仅在维护者坚持时做", "batch": "批 5：条件项"}, {"id": "STR-R-26", "plan_id": "R-26", "title": "门禁与文档", "batch": "批 1：包管理与治理"}, {"id": "STR-R-27", "plan_id": "R-27", "title": "门禁与文档", "batch": "批 1：包管理与治理"}, {"id": "STR-R-28", "plan_id": "R-28", "title": "门禁与文档", "batch": "批 1：包管理与治理"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = n => (n==null? '—' : n.toLocaleString('en-US'));

$('#title').textContent = D.meta.title;
$('#meta').innerHTML = `HEAD <code>${esc(D.meta.head)}</code> · ${esc(D.meta.audit_date)} · 数据来源：`
  + D.meta.sources.map(s=>`<code>${esc(s)}</code>`).join('、');
$('#crates-note').innerHTML = esc(D.meta.note);
$('#identity-note').innerHTML = esc(D.meta.identity);
$('#foot').innerHTML = `体量：清点口径 ${esc(D.meta.inv_scope_members)}；全工作树 ${esc(D.meta.tree_scope_all)}。`
  + ` 本图不含任何推断数字：每格都能在来源文件里找到对应行。`;

/* tabs */
const TABS = [['p-crates','crate 顶层与体量'],['p-pkg','包管理'],['p-tree','目录与文件归属'],['p-batch','分批与 28 项步骤'],['p-nam','命名与文件归属'],['p-amb','命名歧义与冲突']];
const tabs = $('#tabs');
TABS.forEach(([id,label],i)=>{
  const b=document.createElement('button');
  b.className='tab'; b.textContent=label; b.setAttribute('role','tab');
  b.setAttribute('aria-selected', i===0 ? 'true':'false');
  b.onclick=()=>{ document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
    document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected','false'));
    $('#'+id).classList.add('on'); b.setAttribute('aria-selected','true'); applyFilter(); };
  tabs.appendChild(b);
});
$('#p-crates').classList.add('on');

/* crate table */
function crateTable(rows, after){
  let h='<table><thead><tr><th>crate</th><th>目录</th>'+(after?'<th>之后</th><th>相关项</th>'
    :'<th class="num">文件</th><th class="num">行数</th><th class="num">fn</th><th class="num">pub fn</th>')+'</tr></thead><tbody>';
  rows.forEach(c=>{
    h+=`<tr class="${c.moving?'moving':''}" data-key="${esc(c.name)} ${esc(c.dir)} ${(c.actions||[]).join(' ')}">
      <td><code>${esc(c.name)}</code></td><td><code>${esc(c.dir)}</code></td>`;
    if(after) h+=`<td>${esc(c.after)}</td><td class="act">${c.moving? c.actions.map(a=>'<span class="pill '+(a==='R-25'?'gone':'change')+'">'+esc(a)+'</span>').join(''):'<span class="pill keep">不变</span>'}</td>`;
    else h+=`<td class="num">${fmt(c.files)}</td><td class="num">${fmt(c.lines)}</td><td class="num">${fmt(c.fn)}</td><td class="num">${fmt(c.pubfn)}</td>`;
    h+='</tr>';
  });
  return h+'</tbody></table>';
}
$('#crates-now').innerHTML = crateTable(D.crates,false);
$('#crates-after').innerHTML = crateTable(D.crates,true);

/* pkg */
$('#pkg-now').innerHTML = '<table><tbody>'+D.pkg.map(r=>`<tr><th style="width:32%">${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')+'</tbody></table>';
$('#pkg-after').innerHTML = '<table><tbody>'+D.pkg.map(r=>`<tr><th style="width:32%">${esc(r[0])}</th><td>${esc(r[2])}</td></tr>`).join('')+'</tbody></table>';

/* tree */
const KIND = {rename:['改名的页','change'], moveout:['职责搬出','change'], split:['拆分','change'],
  merge:['合并','change'], new:['新增','new'], move:['归位','change'], doc:['文档/导览','change'],
  unchanged:['不变','keep']};
$('#tree-now').innerHTML = '<table><thead><tr><th>路径</th><th>现状</th></tr></thead><tbody>'
  + D.tree.map(t=>`<tr data-key="${esc(t[0])} ${esc(t[3]||'')}"><td><code>${esc(t[0])}</code></td>
      <td>${t[2]==='unchanged'?'<span class="pill keep">不变</span>':esc(t[1].replace(/^→ /,''))}</td></tr>`).join('')
  + '</tbody></table>';
$('#tree-after').innerHTML = '<table><thead><tr><th>路径</th><th>动作</th><th>说明</th><th>项</th></tr></thead><tbody>'
  + D.tree.filter(t=>t[2]!=='unchanged').map(t=>`<tr data-key="${esc(t[0])} ${esc(t[3]||'')}">
      <td><code>${esc(t[0])}</code></td><td><span class="pill ${KIND[t[2]][1]}">${KIND[t[2]][0]}</span></td>
      <td>${esc(t[1])}</td><td class="act">${t[3]? '<code>'+esc(t[3])+'</code>':''}</td></tr>`).join('')
  + '</tbody></table>';

/* batches + actions */
$('#batches').innerHTML = '<table><thead><tr><th>批</th><th>项</th><th>前置</th><th>身份迁移</th><th>与版本推进同批</th></tr></thead><tbody>'
  + D.batches.map(b=>`<tr><td><strong>${esc(b[0])}</strong></td><td>${esc(b[1])}</td><td>${esc(b[2])}</td>
     <td>${esc(b[3])}</td><td>${esc(b[4])}</td></tr>`).join('') + '</tbody></table>';
$('#actions').innerHTML = '<table><thead><tr><th>id</th><th>项</th><th>批</th></tr></thead><tbody>'
  + D.actions.map(a=>`<tr data-key="${esc(a.id)} ${esc(a.title)}"><td><code>${esc(a.id)}</code></td>
     <td>${esc(a.title)}</td><td>${esc(a.batch)}</td></tr>`).join('') + '</tbody></table>';

/* naming view */
(function(){
  const N = D.nam || [];
  const by = k => N.reduce((m,x)=>{m[x[k]]=(m[x[k]]||0)+1;return m;},{});
  const axis = by('axis'); const sev = by('severity'); const ver = by('verify');
  let facts = '<table><tbody>';
  facts += `<tr><th>条目数</th><td class="num">${N.length}</td></tr>`;
  facts += `<tr><th>按严重度</th><td>${Object.entries(sev).map(([k,v])=>`<span class="pill ${k==='MAJOR'?'change':'keep'}">${k} ${v}</span>`).join('')}</td></tr>`;
  facts += `<tr><th>按轴</th><td>${Object.entries(axis).map(([k,v])=>`<span class="pill">${esc(k)} ${v}</span>`).join('')}</td></tr>`;
  facts += `<tr><th>复核状态</th><td>${Object.entries(ver).map(([k,v])=>`<span class="pill">${esc(k)} ${v}</span>`).join('')}</td></tr>`;
  facts += `</tbody></table>`;
  document.getElementById('nam-facts').innerHTML = facts;
  document.getElementById('nam-table').innerHTML =
    '<table><thead><tr><th>id</th><th>严重度</th><th>旧名</th><th>建议新名</th><th>复核</th></tr></thead><tbody>'
    + N.slice().sort((a,b)=>a.axis.localeCompare(b.axis)||a.id.localeCompare(b.id)).map(x=>
        `<tr data-key="${esc(x.id)} ${esc(x.old)} ${esc(x.new)}"><td><code>${esc(x.id)}</code></td>
         <td><span class="pill ${x.severity==='MAJOR'?'change':'keep'}">${esc(x.severity)}</span></td>
         <td><code>${esc(x.old)}</code></td><td>${x.new? '<code>'+esc(x.new)+'</code>':'—'}</td>
         <td>${esc(x.verify)}</td></tr>`).join('')
    + '</tbody></table>';
  if (D.nam_d3_note) {
    const d3 = document.createElement('p');
    d3.className = 'note';
    d3.style.borderLeft = '3px solid var(--accent)';
    d3.style.paddingLeft = '8px';
    d3.innerHTML = esc(D.nam_d3_note).replace(/\*\*/g, '').replace(/`/g, '');
    document.getElementById('p-nam').insertBefore(d3, document.getElementById('nam-note'));
  }
  document.getElementById('nam-note').innerHTML =
    '本视图的数字全部来自 <code>audit-findings.json</code> 的 <code>NAM-*</code> 条目（与 <code>audit-report.md</code> §7 同源）；'
    + '「命名共识」11 条规则（D-1…D-11）与其谓词见报告 §7.2，改名落地时按棘轮先钉现状清单。';
})();

/* ambiguity view */
(function(){
  const A = D.amb || [];
  const by = k => A.reduce((m,x)=>{m[x[k]]=(m[x[k]]||0)+1;return m;},{});
  const q = by('q'), sev = by('severity'), ver = by('verify');
  let facts = '<table><tbody>';
  facts += `<tr><th>条目数</th><td class="num">${A.length}</td></tr>`;
  facts += `<tr><th>按四问</th><td>${Object.entries(q).map(([k,v])=>`<span class="pill">${esc(k)} ${v}</span>`).join('')}</td></tr>`;
  facts += `<tr><th>按严重度</th><td>${Object.entries(sev).map(([k,v])=>`<span class="pill ${k==='MAJOR'?'change':'keep'}">${k} ${v}</span>`).join('')}</td></tr>`;
  facts += `<tr><th>复核状态</th><td>${Object.entries(ver).map(([k,v])=>`<span class="pill">${esc(k)} ${v}</span>`).join('')}</td></tr>`;
  facts += '</tbody></table>';
  document.getElementById('amb-facts').innerHTML = facts;
  document.getElementById('amb-table').innerHTML =
    '<table><thead><tr><th>id</th><th>严重度</th><th>现状名</th><th>读者会先当成什么</th><th>建议</th></tr></thead><tbody>'
    + A.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(x=>
        `<tr data-key="${esc(x.id)} ${esc(x.subject)}"><td><code>${esc(x.id)}</code></td>
         <td><span class="pill ${x.severity==='MAJOR'?'change':'keep'}">${esc(x.severity)}</span></td>
         <td><code>${esc(x.subject)}</code></td><td>${esc(x.reader.slice(0,160))}</td>
         <td>${esc((x.fix||x.conflict).slice(0,160))}</td></tr>`).join('')
    + '</tbody></table>';
  document.getElementById('amb-note').innerHTML =
    '数字全部来自 <code>audit-findings.json</code> 的 <code>AMB-*</code> 条目（与 <code>audit-report.md</code> §7.6–§7.10 同源）；'
    + '四问判据与「不是缺陷」清单见报告 §7.6/§7.9，歧义共识 R-1…R-4 见 §7.7（与 §7.2 的 D-1…D-11 交叉引用、不重复计数）。';
})();

/* filter */
function applyFilter(){
  const q = $('#q').value.trim().toLowerCase();
  const only = $('#onlymoving').checked;
  let shown=0, total=0;
  document.querySelectorAll('.panel.on tbody tr').forEach(tr=>{
    total++;
    let ok = !q || (tr.dataset.key || tr.textContent).toLowerCase().includes(q);
    if (only){
      const isMoving = tr.classList.contains('moving')
        || tr.dataset.key && /R-\d\d/.test(tr.dataset.key)
        || tr.querySelector('.pill.change, .pill.new');
      if (!isMoving) ok = false;
    }
    tr.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  $('#count').textContent = `${shown}/${total} 行`;
}
$('#q').addEventListener('input', applyFilter);
$('#onlymoving').addEventListener('change', applyFilter);
applyFilter();
</script>
</body>
</html>
