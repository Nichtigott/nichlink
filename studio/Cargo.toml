[package]
name = "nichlink-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/Nichtigott/nichlink"
homepage = "https://github.com/Nichtigott/nichlink"
description = "Ratatui Studio for NichLink registry authoring and diagnostics"
keywords = ["tui", "ratatui", "inspector", "authoring"]
categories = ["command-line-utilities", "development-tools::debugging", "visualization"]
readme = "README.md"
documentation = "https://docs.rs/nichlink-studio"
default-run = "nichlink-studio"

[features]
# The call tree is drawn by the `rataflow` widget by default; the hand-drawn
# canvases in `ui/graph` stay compiled in and one key (`g`) away, because they are
# the ones that draw what the kernel knows (evidence kinds, cut counts, the cursor
# versus the focus) and the ones that fit a seven-cell column.
# 调用树默认由 `rataflow` 控件绘制；`ui/graph` 里的手绘画布仍然编入并只差一个按键（`g`）：
# 画的正是内核知道的东西（证据种类、裁剪计数、游标与焦点的区分），也是塞得进七格宽列的那个。
default = ["node-graph"]
node-graph = ["dep:rataflow"]
# Test-only fixtures for a checkout, not a published capability. The fixture host
# lives in `studio/tests/fixtures/node-editor/`, a nested package that cargo does
# not put in the `.crate`, so the tests behind this feature skip when the fixture
# is absent — a consumer cannot satisfy it. It is listed because CI compiles the
# whole workspace with `--all-features`, and `AGENTS.md` records the same boundary.
# 仅测试用的检出夹具，不是已发布的能力。夹具宿主位于 `studio/tests/fixtures/node-editor/`，
# 那是 cargo 不会放进 `.crate` 的嵌套包，因此该特性之后的测试在夹具缺席时跳过——消费方无法满足
# 它。它列在这里是因为 CI 以 `--all-features` 编译整个工作区，`AGENTS.md` 记录了同一条边界。
prototype-fixtures = []
# `nichlink-dev` rebuilds Studio from this checkout and launches the workspace's
# `target/debug` build, so an installed copy can do neither. Gating the bin keeps
# `cargo install nichlink-studio` from shipping a tool that cannot run; a
# maintainer opts in explicitly:
# `cargo run -p nichlink-studio --features dev-supervisor --bin nichlink-dev -- watch`.
# `nichlink-dev` 从本检出重建 Studio 并启动工作区的 `target/debug` 产物，安装副本这两件
# 事都做不到。给这个 bin 加门控，`cargo install nichlink-studio` 就不会带出一个跑不起来
# 的工具；维护者显式启用它：
# `cargo run -p nichlink-studio --features dev-supervisor --bin nichlink-dev -- watch`。
dev-supervisor = []

[lib]
name = "nichlink_studio"
path = "src/lib.rs"

[dependencies]
crossterm = "0.29"
notify = "7"
# 0.30 split the widgets out and made both the widget set and the layout cache
# opt-in features: with `default-features = false` a bare `crossterm` build has no
# `Block` and no `Paragraph`, and layout would recompute on every frame.
# 0.30 把控件拆了出去，并把控件集与布局缓存都变成可选特性：在 `default-features = false`
# 下只开 `crossterm` 会没有 `Block`、也没有 `Paragraph`，而且每帧都要重算布局。
ratatui = { version = "0.30", default-features = false, features = [
    "all-widgets",
    "crossterm",
    "layout-cache",
] }
# The node-editor widget, behind a non-default feature: it is a 0.1.0 dependency
# with its own opinion about who owns pan, zoom and selection, so it runs beside
# the hand-drawn canvas instead of replacing it until it earns the place.
# 节点编辑器控件，放在非默认特性之后：它是 0.1.0 的依赖，对"平移、缩放、选择归谁"有自己的
# 主张，因此它与手绘的画布并存，而不是直接取代它。
rataflow = { version = "0.1", optional = true, default-features = false, features = [
    "crossterm",
] }
nichlink-run-method = { path = "../run_method", version = "0.1.1", features = ["authoring"] }
nichlink-debug-method = { path = "../debug_method", version = "0.1.1" }
nichlink-build-method = { path = "../build_method", version = "0.1.1" }

[[bin]]
name = "nichlink-studio"
path = "src/main.rs"
doc = false

# Workspace-only: `required-features` is what `publish = false` would be if Cargo
# had it per target. See the `dev-supervisor` comment above.
# 仅限工作区：Cargo 没有按 target 的 `publish = false`，`required-features` 就是它的
# 等价物。见上面 `dev-supervisor` 的说明。
[[bin]]
name = "nichlink-dev"
path = "src/bin/nichlink-dev.rs"
doc = false
required-features = ["dev-supervisor"]

# `prototype-fixtures` gates test-only fixtures rather than public API, but it
# is the feature CI compiles `--all-features`, so docs.rs builds the same set
# and cannot silently diverge from the tested configuration.
# `prototype-fixtures` 门控的是测试用 fixture 而非公开 API，但它正是 CI 用
# `--all-features` 编译的那一套；docs.rs 构建同一集合，就不会与受测配置悄悄分叉。
[package.metadata.docs.rs]
all-features = true
