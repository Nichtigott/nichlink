# Source-only Studio fixture package. It is intentionally NOT a member of the
# NichLink workspace: it exists so the `prototype-fixtures` tests in
# `studio/src/studio/app/tests/` have a real host source tree to index. Studio
# reads `src/` as plain text, so this package is never compiled and has no
# `target/` directory.
# 仅源码的 Studio 夹具包。它刻意不是 NichLink 工作区成员：它的存在只是为了让
# `studio/src/studio/app/tests/` 里的 `prototype-fixtures` 测试有一棵真实的宿主源码树
# 可索引。Studio 只把 `src/` 当文本读取，因此本包从不编译，也没有 `target/` 目录。
#
# The inner `[workspace]` table makes this manifest its own workspace root, so
# Cargo can never fold it into an enclosing workspace.
# 内部的 `[workspace]` 表让本清单成为它自己的工作区根，Cargo 因此绝不会把它并入外层
# 工作区。
[workspace]

[package]
name = "nichlink-fixture-node-editor"
version = "0.1.0"
edition = "2024"
publish = false
description = "Source-only Studio fixture: the NodeEditor host package."

[lib]
name = "node_editor_fixture"
path = "src/lib.rs"

[dependencies]
nichlink-run-method = { path = "../../../../run_method", version = "0.1.0", features = ["authoring"] }

[build-dependencies]
nichlink-build-method = { path = "../../../../build_method", version = "0.1.0" }
