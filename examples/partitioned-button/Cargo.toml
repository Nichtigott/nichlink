# A **partitioned** example host: the declaration lives in `host/add_crates.rs`, and the two
# generated packages beside it (`partitioned-button-objects`, `partitioned-button-facade`) are the
# crates the split produced — committed, because "declare once, split on submit" is the deal.
# 一个**被划分过的**示例宿主：声明住在 `host/add_crates.rs`，它旁边那两个生成包
# （`partitioned-button-objects`、`partitioned-button-facade`）就是这次拆分产出的 crate —— 它们入库，
# 因为"顶层声明一次、提交时生成"就是这套东西的约定。
[workspace]
resolver = "3"
members = ["host", "graft", "partitioned-button-facade", "partitioned-button-objects"]
