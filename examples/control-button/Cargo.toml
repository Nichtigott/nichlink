[package]
name = "nichlink-example-control-button"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"
description = "NichLink example: the README Control/Button tree as a real host crate."

[lib]
name = "control_button"
path = "src/lib.rs"

[dependencies]
nichlink-run-method = { path = "../../run_method", version = "0.1.0" }
# A statically grafted implementation is named by a Rust path at the host entry,
# so it has to be linked in. A string-named graft would not need this.
nichlink-example-control-button-graft = { path = "../control-button-graft" }

[build-dependencies]
nichlink-build-method = { path = "../../build_method" }
